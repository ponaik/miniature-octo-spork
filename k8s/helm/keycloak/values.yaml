replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.4.2"
  pullPolicy: IfNotPresent
  command: ["start-dev"]

#postgres:
#  image:
#    repository: postgres
#    tag: "17-alpine"
#  storage:
#    size: "1Gi"
#    className: "standard"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  hosts:
    - host: keycloak.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Application Configuration
config:
  hostname: "keycloak.local"
  proxyMode: "edge"
  dbName: "keycloak"

livenessProbe:
  httpGet:
    path: /realms/master
    port: 8080
  initialDelaySeconds: 40
  periodSeconds: 15
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /realms/master
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10

# Sealed Secrets
secret:
  name: keycloak-env-secrets
  encryptedData:
    KEYCLOAK_ADMIN: ""
    KEYCLOAK_ADMIN_PASSWORD: ""
    KEYCLOAK_POSTGRES_DB: ""
    KEYCLOAK_POSTGRES_PASSWORD: ""
    KEYCLOAK_POSTGRES_USER: ""
