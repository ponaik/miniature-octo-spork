replicaCount: 1

image:
  repository: ponaik/userservice
  pullPolicy: IfNotPresent
  tag: "1.1.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: user.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: chart-example-tls
  #   hosts:
  #     - chart-example.local

# Application Specific Configuration
config:
  springProfilesActive: "prod"
  datasourceUrl: "jdbc:postgresql://user-postgres:5432/${USERSERVICE_DB_SCHEMA}"
  redisHost: "user-redis"
  redisPort: "6379"
  keycloakIssuerUri: "http://keycloak:8080/realms/UserService"
  openapiIssuerUri: "http://keycloak.local/realms/UserService"

probes:
  liveness:
    initialDelaySeconds: 40
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10

# Sealed Secrets Configuration
secret:
  name: userservice-secrets
  encryptedData:
    USERSERVICE_DB_PASS: ""
    USERSERVICE_DB_SCHEMA: ""
    USERSERVICE_DB_USER: ""