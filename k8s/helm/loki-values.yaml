# Deployment mode: SingleBinary (simple), SimpleScalable (medium), Distributed (large)
deploymentMode: SingleBinary

# Number of replicas
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard"

# Component replicas
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

## Persistence settings to ensure logs survive pod restarts in Minikube
#write:
#  persistence:
#    size: 10Gi
#read:
#  persistence:
#    size: 10Gi

# Caching
chunksCache:
  enabled: false
resultsCache:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      default_labels_enabled: true