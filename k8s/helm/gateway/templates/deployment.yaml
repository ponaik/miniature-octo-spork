apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-config
          env:
            - name: NETWORK_AUTH_SERVICE_SERVICE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GATEWAY_CLIENT_ID
            - name: NETWORK_AUTH_SERVICE_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GATEWAY_CLIENT_SECRET
            - name: NETWORK_AUTH_SERVICE_AUTHENTICATION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: AUTH_CLIENT_ID
            - name: NETWORK_AUTH_SERVICE_AUTHENTICATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: AUTH_CLIENT_SECRET
            - name: JAVA_OPTS
              value: {{ .Values.global.javaOptions | quote }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            requests:
              memory: {{ .Values.global.resources.requests.memory | quote }}
              cpu: {{ .Values.global.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.global.resources.limits.memory | quote }}
              cpu: {{ .Values.global.resources.limits.cpu | quote }}
            {{- end }}