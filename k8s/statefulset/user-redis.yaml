apiVersion: v1
kind: Service
metadata:
  name: user-redis
  labels:
    app: user-redis
spec:
  ports:
    - port: 6379
      name: user-redis
  clusterIP: None
  selector:
    app: user-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-redis
spec:
  serviceName: "user-redis"
  replicas: 1
  selector:
    matchLabels:
      app: user-redis
  template:
    metadata:
      labels:
        app: user-redis
    spec:
      containers:
        - name: redis
          image: redis:8.2.2-alpine
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi