apiVersion: v1
kind: Service
metadata:
  name: payment-mongo
  labels:
    app: payment-mongo
spec:
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None
  selector:
    app: payment-mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-mongo
spec:
  serviceName: "payment-mongo"
  replicas: 1
  selector:
    matchLabels:
      app: payment-mongo
  template:
    metadata:
      labels:
        app: payment-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.2.2
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: payment-data
              mountPath: /data/db
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: payment-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "standard"
        resources:
          requests:
            storage: 1Gi
