apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ponaik/gateway:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak:8080/realms/UserService"

            # --- GATEWAY CLIENT CREDENTIALS ---
            - name: NETWORK_AUTH_SERVICE_SERVICE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: GATEWAY_CLIENT_ID
            - name: NETWORK_AUTH_SERVICE_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: GATEWAY_CLIENT_SECRET
            - name: NETWORK_AUTH_SERVICE_AUTHENTICATION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: AUTH_CLIENT_ID
            - name: NETWORK_AUTH_SERVICE_AUTHENTICATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: AUTH_CLIENT_SECRET

            # --- SERVICE ROUTES ---
            - name: USERSERVICE_BASEURL
              value: "http://userservice:8080"
            - name: ORDERSERVICE_BASEURL
              value: "http://orderservice:8080"
            - name: PAYMENTSERVICE_BASEURL
              value: "http://paymentservice:8080"

            # --- NETWORK & SWAGGER CONFIG ---
            - name: NETWORK_AUTH_SERVICE_BASE_URL
              value: "http://keycloak:8080"
            - name: OPENAPI_OAUTH_ISSUER_URI
              value: "http://keycloak.local/realms/UserService"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10